<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arsi University - HR Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/auth-ui.css" />
    <style>
      .splash-main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .splash-card {
        width: 100%;
        max-width: 460px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 40px 32px;
        border-radius: var(--au-radius-lg);
        background: var(--au-surface-lowest);
        box-shadow: var(--au-shadow-lg);
        text-align: center;
      }

      .splash-seal {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: var(--au-radius);
        background: var(--au-surface-low);
        color: var(--au-primary);
      }

      .splash-seal svg {
        width: 36px;
        height: 36px;
      }

      .splash-card h1 {
        margin: 2px 0 0;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--au-primary);
      }

      .splash-card h2 {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        color: var(--au-on-surface-variant);
      }

      .splash-spinner {
        width: 30px;
        height: 30px;
        margin: 10px 0 2px;
        border: 3px solid var(--au-surface-high);
        border-top-color: var(--au-primary);
        border-radius: 50%;
        animation: splash-spin 0.9s linear infinite;
      }

      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .splash-status {
        margin: 0;
        font-size: 12px;
        color: var(--au-on-surface-variant);
      }

      .splash-card .au-submit {
        margin-top: 8px;
        text-decoration: none;
      }

      .splash-note {
        margin: 0;
        font-size: 10px;
        line-height: 16px;
        color: var(--au-on-surface-variant);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-spinner {
          animation-duration: 3s;
        }
      }
    </style>
  </head>
  <body class="au-body">
    <main class="splash-main">
      <div class="splash-card">
        <div class="splash-seal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z" />
            <path d="M6 10.5V16c0 1.9 2.7 3.5 6 3.5s6-1.6 6-3.5v-5.5" />
            <path d="M21 8v6" />
          </svg>
        </div>

        <h1>Arsi University</h1>
        <h2>Human Resource Management System</h2>

        <div class="splash-spinner" role="status" aria-label="Redirecting"></div>
        <p class="splash-status">Redirecting to secure portal sign-in…</p>

        <a href="/login" class="au-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.5" y="10" width="15" height="10" rx="2.5" />
            <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" />
          </svg>
          <span>Go to Login Page</span>
        </a>

        <p class="splash-note">
          Not redirected within 5 seconds? Use the button above. Institutional
          access is restricted to authorised staff and faculty.
        </p>
      </div>
    </main>

    <script>
      // Auto-redirect after 3 seconds
      setTimeout(() => {
        window.location.href = "/login";
      }, 3000);

      // Check if user is already logged in
      fetch("/api/auth/check")
        .then((response) => response.json())
        .then((data) => {
          if (data.authenticated) {
            if (data.user.role === "admin") {
              window.location.href = "/admin-dashboard";
            } else {
              window.location.href = "/employee-dashboard";
            }
          }
        })
        .catch(() => {
          /* stay on the splash; the timer still redirects */
        });
    </script>
  </body>
</html>
